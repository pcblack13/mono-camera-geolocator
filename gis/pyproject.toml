[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landexplorer-gis"
version = "1.0.0"
description = "LandExplorer geospatial layer: slippy-map math, CRS, imagery providers, accuracy, exports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LandExplorer" }]

# ★ BASE DEPS ONLY. `gis` is a library: anything here is inherited by every consumer.
#   No fastapi, no sqlalchemy, no CV. See CONTRACT.md §10.6.
#
#   httpx is BASE and NOT an extra, deliberately: gis/imagery/providers/__init__.py
#   registers every provider eagerly (§11.5), so it cannot be optional. It is NONETHELESS
#   call-time bound in gis/imagery/http.py (§11.3) so the suite collects with httpx
#   absent. Both, on purpose.
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# ★ pyproj is OPTIONAL on the dev box only: gis/crs.py falls back pyproj -> osgeo.osr ->
#   closed-form NumPy (§11.3). The BACKEND IMAGE must pin it — a container with neither
#   pyproj nor GDAL can only do 4326<->3857, which makes total_ce90_m (mandatory on every
#   GCP) uncomputable and local_orthophoto dead. gis.crs.probe() surfaces which bound.
pyproj = ["pyproj>=3.6"]
rasterio = ["rasterio>=1.3"]
redis = ["redis>=5.0"]
exports = [
    "geopandas>=1.0",
    "fiona>=1.9",
    "ezdxf>=1.1",
    "reportlab>=4.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["gis*"]

[tool.setuptools.package-data]
gis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src/gis/tests"]
# ★ NO NETWORK in this suite, ever: the fixture provider and a committed 64x64 GeoTIFF
#   cover every path. A test that reaches a provider is a test that fails on a plane.
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gis"]
mypy_path = "src"
