# LandExplorer — Alembic configuration (CONTRACT.md §5.7).
#
# ★ No `sqlalchemy.url` here, deliberately. The URL comes from Settings (LE_DATABASE_URL,
#   which has a working default — L10) and is set on the config object inside env.py.
#   A URL in this file is a credential in a committed file, and it is also a second
#   source of truth for the one thing the whole app must agree on.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Single linear head (§5). Filenames are `0001_enable_extensions.py` … — the revision
# id is the numeric prefix, so `alembic history` sorts the way the directory does.
file_template = %%(rev)s_%%(slug)s

# Timestamps in migrations are UTC when they appear at all.
timezone = UTC

[post_write_hooks]
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
