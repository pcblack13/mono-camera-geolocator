[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landexplorer-backend"
version = "1.0.0"
description = "LandExplorer — FastAPI + Celery backend for agricultural GCP surveying."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# ── Runtime deps ───────────────────────────────────────────────────────────────
# Kept in lockstep with requirements.txt, which is the authoritative pin set for
# the image (§9.14, §13.4 rule 7). Ranges here, exact pins there: this file has to
# stay installable as a library; requirements.txt has to be reproducible.
#
# ★ landexplorer-ai-engine and landexplorer-gis are PATH dependencies (§2.4). They
#   are not on any index. Install them from the working tree FIRST:
#       pip install -e ./ai_engine --no-deps
#       pip install -e ./gis --no-deps
#   --no-deps because numpy/cv2/scipy/torch/osgeo are system-site packages here and
#   osgeo cannot be pip-installed at all (§0.1). [tool.uv.sources] below wires the
#   same thing up automatically for uv users.
dependencies = [
    "landexplorer-ai-engine",
    "landexplorer-gis",

    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    # ws:// and wss:// DATA FEEDS (live_data_service) — a uvicorn extra carries it
    # too, but the feed depends on it directly and says so.
    "websockets>=14,<18",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "geoalchemy2>=0.15,<0.16",
    "celery[redis]>=5.4,<6",
    "redis>=5.2,<6",
    "python-multipart>=0.0.20",
    "pillow>=12,<13",
    "httpx>=0.28,<0.29",
    "orjson>=3.10,<4",
    "structlog>=24.4,<25",
    "prometheus-client>=0.21,<0.22",
    "numpy>=2.4,<3",
    "opencv-python-headless>=4.13,<5",
    "scipy>=1.17,<2",
]

[project.optional-dependencies]
# Every extra below degrades gracefully when absent (§11.3) — with ONE exception,
# `s3`: boto3 is only reachable via LE_STORAGE_BACKEND=s3, which makes its absence a
# configuration error rather than a degradation, and app.storage raises
# ConfigurationError at boot rather than silently writing nowhere.
s3 = ["boto3>=1.35,<2"]

# For the backend IMAGE only (§9.14). On the dev box, system GDAL 3.8.4 substitutes
# via gis/rasterio_shim.py; inside a container nothing substitutes.
geo = ["pyproj>=3.7,<4", "rasterio>=1.4,<2"]

# Deep models. Never required: a missing weight is a WARNING + fallback (L1/L11).
deep = ["torch>=2.11", "torchvision>=0.26"]

# Optional export writers. CSV/GeoJSON/KML/KMZ are stdlib-only and can NEVER degrade,
# so the surveyor can always get their coordinates out.
exports = ["geopandas>=1.0", "fiona>=1.10", "shapely>=2.0", "ezdxf>=1.3", "reportlab>=4.2"]

tracing = ["opentelemetry-sdk>=1.29", "opentelemetry-exporter-otlp>=1.29"]

dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-cov>=6",
    "testcontainers[postgres]>=4.9,<5",
    "hypothesis>=6.123",
    "mypy>=1.14",
    "ruff>=0.8",
    "black>=24.10",
]

[tool.uv.sources]
landexplorer-ai-engine = { path = "../ai_engine", editable = true }
landexplorer-gis = { path = "../gis", editable = true }

[tool.setuptools]
# app/ is a flat package at the backend root; alembic/ ships beside it but is not
# importable library code (it is invoked by path via alembic.ini).
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = ["py.typed"]
